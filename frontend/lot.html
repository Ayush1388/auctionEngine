<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marque | Lot</title>
  <script>try{if(localStorage.getItem("marque-theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Koulen&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="app/app.css"><link rel="stylesheet" href="lot.css"><link rel="stylesheet" href="app/trace.css"><link rel="stylesheet" href="app/lab.css">
</head>
<body>
<header id="appbar"></header>

<main class="lt" id="lotMain" aria-busy="true">
  <div class="lt-grid">
    <div class="lt-left">
      <div class="lt-stage">
        <img id="gMain" src="assets/hero.jpg" alt="">
        <a class="lt-back mono" id="backLink" href="index.html">Back to auction</a>
        <div class="lt-arrows"><button class="arrow" id="gPrev" aria-label="Previous view">‹</button><button class="arrow" id="gNext" aria-label="Next view">›</button></div>
        <span class="lt-count mono" id="gCount">01 / 04</span>
      </div>
      <ol class="lt-thumbs" id="gThumbs"></ol>

      <div class="lt-tabs" role="tablist" aria-label="Lot details" id="tabs"></div>
      <div class="lt-panel" id="panel" role="tabpanel"></div>
    </div>

    <aside class="lt-right">
      <div class="lt-nextprev mono"><a id="prevLot" href="#">Prev lot</a><a id="nextLot" href="#">Next lot</a></div>
      <div class="lt-top">
        <p class="mono lt-lotline"><span id="lotNo"></span><span class="lt-live" id="liveTag">Connecting</span></p>
        <div class="lt-tools"><button class="lt-tool" id="saveBtn" aria-pressed="false">Save</button><button class="lt-tool" id="shareBtn">Share</button></div>
      </div>
      <h1 id="lotTitle"><span class="skel" style="display:block;height:48px;width:80%"></span></h1>
      <p class="lt-sub" id="lotSub"></p>
      <ul class="lt-chips" id="chips"></ul>

      <section class="lt-bidbox" id="bidbox" aria-label="Bidding">
        <div class="lt-bid-row">
          <div><span class="mono lt-lab">Current bid</span><strong id="curBid" class="lt-big">-</strong><span class="lt-delta" id="delta"></span></div>
          <div class="lt-cell"><span class="mono lt-lab">Bids</span><strong id="bidCount" class="lt-mid">-</strong></div>
          <div class="lt-cell"><span class="mono lt-lab" id="clockLab">Time remaining</span><strong class="lt-clock" id="clock">--:--:--</strong></div>
        </div>

        <div class="lt-snipe" id="snipe" hidden role="status"></div>

        <div class="lt-range"><div class="lt-range-bar"><i id="mark"></i></div><div class="lt-range-lab mono"><span id="estLow"></span><span id="resv"></span><span id="estHigh"></span></div></div>

        <div class="lt-wallet" id="walletLine"></div>

        <form class="lt-form" id="bidForm" novalidate>
          <div class="lt-field"><button type="button" id="minus" aria-label="Decrease">−</button><label class="visually" for="amt">Bid amount in dollars</label><input id="amt" inputmode="numeric" autocomplete="off"><button type="button" id="plus" aria-label="Increase">+</button></div>
          <button class="btn lt-go" id="goBtn" type="submit">Place bid</button>
        </form>
        <p class="lt-min" id="minLine"></p>
        <div class="lt-result" id="result" role="status" aria-live="polite"></div>

        <details class="lt-proxy" id="proxy"><summary>Set a maximum bid</summary><div id="proxyBody"></div></details>

        <div class="lt-demo">
          <button class="btn btn-line btn-sm" id="traceBtn" aria-controls="trace">Behind the bid</button>
          <button class="btn btn-line btn-sm" id="stressBtn" aria-controls="trace">Stress it</button>
        </div>
      </section>

      <section class="lt-history" aria-label="Bid history">
        <div class="lt-hist-head"><h2>Live Bid History</h2><span class="mono lt-live" id="histLive">Live updates</span></div>
        <table><thead><tr><th>#</th><th>Bidder</th><th>Amount</th><th>Time</th></tr></thead><tbody id="hist"></tbody></table>
        <p class="lt-hist-empty" id="histEmpty" hidden>No bids yet. The first bid sets the price.</p>
      </section>
    </aside>
  </div>
</main>

<section class="lt-quote" id="quoteBand" hidden><img id="qImg" src="" alt=""><div class="lt-quote-in"><p class="mono" id="qEvent"></p><blockquote id="qText"></blockquote></div><a class="mono" id="qLink" href="#">Explore the event</a></section>

<dialog class="sheet" id="receipt" aria-labelledby="rcTitle"></dialog>

<footer id="appfooter"></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script type="module" src="lot.js"></script>
<script src="motion.js"></script>
</body>
</html>
