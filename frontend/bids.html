<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marque | My bids</title>
  <script>try{if(localStorage.getItem("marque-theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Koulen&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="app/app.css"><link rel="stylesheet" href="app/pages.css">
</head>
<body>
<header id="appbar"></header>

<main class="page">
  <div class="page-head">
    <div><h1>My bids</h1><p>Every lot you have bid on, and where you stand. This page updates as bids land.</p></div>
    <a class="btn btn-line" href="index.html#classic">Find a car</a>
  </div>
  <div id="bidsBody" aria-busy="true"><div class="skel" style="height:44px"></div><div class="skel" style="height:96px;margin-top:16px"></div><div class="skel" style="height:96px;margin-top:12px"></div></div>
</main>

<footer id="appfooter"></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app/pages/bids.js"></script>
</body>
</html>
