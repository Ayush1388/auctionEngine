name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: auction
          POSTGRES_PASSWORD: auction
          POSTGRES_DB: auction_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auction -d auction_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20

      kafka:
        image: apache/kafka:3.8.0
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 15

    env:
      TEST_DATABASE_URL: postgres://auction:auction@localhost:5432/auction_test?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/0
      TEST_ELASTICSEARCH_URL: http://localhost:9200
      TEST_KAFKA_BROKERS: localhost:9092

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The committed gRPC code must match api/proto. Regenerate it and fail
      # if anything changed (someone edited the .proto and forgot `make proto`).
      - name: Generated code is up to date
        run: |
          make proto USE_PROTOGEN=1 GOBIN="$(go env GOPATH)/bin"
          git diff --exit-code -- internal/gen

      - name: Test
        run: go test -race -count=1 ./...
