name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: auction
          POSTGRES_PASSWORD: auction
          POSTGRES_DB: auction_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auction -d auction_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20

      kafka:
        image: apache/kafka:3.8.0
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 15

    env:
      TEST_DATABASE_URL: postgres://auction:auction@localhost:5432/auction_test?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/0
      TEST_ELASTICSEARCH_URL: http://localhost:9200
      TEST_KAFKA_BROKERS: localhost:9092

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The committed gRPC code must match api/proto. Regenerate it and fail
      # if anything changed (someone edited the .proto and forgot `make proto`).
      - name: Generated code is up to date
        run: |
          make proto USE_PROTOGEN=1 GOBIN="$(go env GOPATH)/bin"
          git diff --exit-code -- internal/gen

      - name: Test
        run: go test -race -count=1 ./...

  # -------------------------------------------------------------------------
  # Deploy the real stack (deploy/compose.yml: Caddy, two API instances, the
  # bidding service, bid workers, PostgreSQL, Redis, Elasticsearch, Kafka,
  # Prometheus, Grafana, Jaeger) and drive it end to end from outside.
  # -------------------------------------------------------------------------
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Fresh random secrets for this run; nothing secret lives in git.
      - name: Configure
        run: |
          cp deploy/.env.example deploy/.env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" deploy/.env
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/" deploy/.env
          sed -i "s/^INTERNAL_TOKEN=.*/INTERNAL_TOKEN=$(openssl rand -hex 32)/" deploy/.env
          sed -i "s/^GRAFANA_ADMIN_PASSWORD=.*/GRAFANA_ADMIN_PASSWORD=$(openssl rand -hex 16)/" deploy/.env

      - name: Start the stack
        run: docker compose -f deploy/compose.yml up -d --build --wait --wait-timeout 600

      - name: End-to-end test
        run: go test -tags e2e -v -count=1 -timeout 15m ./e2e

      # A zero-downtime rollout must keep serving while each instance is
      # replaced: run it while a probe hammers the API, and fail on any
      # error response.
      - name: Rolling deploy without dropped requests
        run: |
          failures=0
          ( while true; do
              code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost/v1/auctions?limit=1)
              [ "$code" = "200" ] || { echo "probe got $code"; echo x >> /tmp/failures; }
              sleep 0.1
            done ) &
          probe=$!
          ./deploy/rollout.sh
          kill $probe
          if [ -s /tmp/failures ]; then
            echo "$(wc -l < /tmp/failures) failed requests during rollout"
            exit 1
          fi
          echo "rollout served every request"

      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/compose.yml logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose -f deploy/compose.yml down -v

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The demo engine has to follow the backend's rules, so it has its own tests.
      - run: node --test frontend/tests/sim-engine.test.mjs

  # -------------------------------------------------------------------------
  # Container image: built for amd64 and arm64 on every pull request, and
  # published to GitHub Container Registry from main. Deploy by commit SHA
  # (immutable), not by "latest".
  # -------------------------------------------------------------------------
  image:
    runs-on: ubuntu-latest
    needs: [test, e2e]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: name
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
