<!doctype html>
<!--
  Minimal client for GET /v1/ws. Open this file in a browser while the API
  runs on localhost:4000, paste an auction ID, then place bids with curl:
  the price updates instantly.
-->
<html>
<head>
<meta charset="utf-8">
<title>Live auction</title>
<style>
  body { font: 16px system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
  input { width: 100%; padding: 8px; font: inherit; }
  .price { font-size: 48px; font-weight: 700; margin: 16px 0 4px; }
  .muted { color: #64748b; }
  #log { font: 12px ui-monospace, monospace; background: #f8fafc; padding: 8px; height: 220px; overflow: auto; }
</style>
</head>
<body>
<h1>Live auction</h1>
<label>Auction ID <input id="auction" placeholder="paste an auction id"></label>
<div class="price" id="price">–</div>
<div class="muted" id="meta">not connected</div>
<h3>Messages</h3>
<pre id="log"></pre>
<script>
  const api = "ws://localhost:4000/v1/ws";
  let ws, version = -1, backoff = 500;

  function log(m) { const el = document.getElementById("log"); el.textContent = m + "\n" + el.textContent; }

  function connect() {
    ws = new WebSocket(api);
    ws.onopen = () => {
      backoff = 500;
      document.getElementById("meta").textContent = "connected";
      const id = document.getElementById("auction").value.trim();
      if (id) ws.send(JSON.stringify({ action: "subscribe", auction_id: id }));
    };
    ws.onmessage = (e) => {
      log(e.data);
      const m = JSON.parse(e.data);
      if (m.type !== "auction.updated") return;
      // Messages can arrive out of order: only apply newer snapshots.
      if (m.auction.version <= version) return;
      version = m.auction.version;
      const a = m.auction;
      document.getElementById("price").textContent = a.current_bid ?? a.min_next_bid;
      document.getElementById("meta").textContent =
        `${a.status} · ${a.bid_count} bids · min next ${a.min_next_bid} · ends ${new Date(a.ends_at).toLocaleTimeString()}`;
    };
    // Reconnect with exponential backoff (1001 = server restarting, 1013 = full).
    ws.onclose = (e) => {
      document.getElementById("meta").textContent = `disconnected (${e.code}), retrying…`;
      setTimeout(connect, backoff);
      backoff = Math.min(backoff * 2, 10000);
    };
  }

  document.getElementById("auction").addEventListener("change", () => { version = -1; ws && ws.close(); });
  connect();
</script>
</body>
</html>
