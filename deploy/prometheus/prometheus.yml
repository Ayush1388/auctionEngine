# Prometheus pulls ("scrapes") GET /metrics from every service's admin
# listener every 15 seconds and stores the numbers as time series.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api-1:9090", "api-2:9090"]

  - job_name: biddingsvc
    static_configs:
      - targets: ["biddingsvc:9091"]

  - job_name: bidworker
    static_configs:
      - targets: ["bidworker:9092"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
